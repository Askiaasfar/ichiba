[build]
  command = "npm run build"
  publish = "dist"

# SPA Fallback for client-side routing (API proxy is configured dynamically in _redirects via prepare-netlify.js)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "ALLOWALL"
