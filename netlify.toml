[build]
  command = "npm run build"
  publish = "dist"

# 1. Netlify API Reverse Proxy
# Forwards /api/* requests to the production backend server, bypassing browser cross-origin blocks
[[redirects]]
  from = "/api/*"
  to = "https://ais-dev-lhxqmcs4pkbt7hegjjbrdg-519153662077.europe-west2.run.app/api/:splat"
  status = 200
  force = true

# 2. SPA Fallback for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "ALLOWALL"
